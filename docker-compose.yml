version: "3.8"

networks:
  bugproof-net:
    driver: bridge

services:
  demo-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    container_name: bugproof-demo-app
    networks:
      bugproof-net:
        aliases:
          - demo-app
    ports:
      - "3001:3000"
    environment:
      - PORT=3000

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: bugproof-dashboard
    networks:
      - bugproof-net
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bugproof-api
    networks:
      - bugproof-net
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./worktrees:/app/worktrees
    environment:
      - PYTHONUNBUFFERED=1

  bug-reproducer:
    build:
      context: .
      dockerfile: docker/Dockerfile.reproducer
    container_name: bugproof-bug-reproducer
    networks:
      - bugproof-net
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1

  code-fixer:
    build:
      context: .
      dockerfile: docker/Dockerfile.fixer
    container_name: bugproof-code-fixer
    networks:
      - bugproof-net
    volumes:
      - ./worktrees:/app/worktrees
      - ./artifacts:/app/artifacts
    environment:
      - CI=true
