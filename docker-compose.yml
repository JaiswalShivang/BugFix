networks:
  bugproof-net:
    driver: bridge

services:
  demo-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    container_name: bugproof-demo-app
    networks:
      bugproof-net:
        aliases:
          - demo-app
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/checkout || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: bugproof-dashboard
    networks:
      - bugproof-net
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bugproof-api
    networks:
      - bugproof-net
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./worktrees:/app/worktrees
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  bug-reproducer:
    build:
      context: .
      dockerfile: docker/Dockerfile.reproducer
    container_name: bugproof-bug-reproducer
    networks:
      - bugproof-net
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/artifacts/reproducer.heartbeat || python -c 'import sys; sys.exit(0)'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  code-fixer:
    build:
      context: .
      dockerfile: docker/Dockerfile.fixer
    container_name: bugproof-code-fixer
    networks:
      - bugproof-net
    volumes:
      - ./worktrees:/app/worktrees
      - ./artifacts:/app/artifacts
    environment:
      - CI=true
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/artifacts/code_fixer.heartbeat || python -c 'import sys; sys.exit(0)'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
