version: "3.8"

services:
  demo-app:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter demo-ecommerce dev -p 3000"
    environment:
      - PORT=3000

  dashboard:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter dashboard dev -p 3000"
    environment:
      - PORT=3000

  api:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn services.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      - PYTHONUNBUFFERED=1

  bug-reproducer:
    image: mcr.microsoft.com/playwright/python:v1.44.0-jammy
    working_dir: /app
    volumes:
      - ./artifacts:/app/artifacts
      - ./services/reproducer:/app/services/reproducer
      - ./packages/contracts:/app/packages/contracts
      - ./configs/switch:/app/configs/switch
    environment:
      - PYTHONUNBUFFERED=1

  code-fixer:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./worktrees:/app/worktrees
      - ./artifacts:/app/artifacts
      - ./services/code-fixer:/app/services/code-fixer
      - ./packages/contracts:/app/packages/contracts
    environment:
      - CI=true
